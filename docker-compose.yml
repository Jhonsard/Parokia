# =============================================================================
# Parokia — full-stack compose (PostgreSQL + FastAPI/MCP + Vite dev server)
# =============================================================================
# Run:  docker compose up --build
# Env:  copy backend/.env.example to backend/.env and set a strong PAROKIA_JWT_SECRET
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: parokia_user
      POSTGRES_PASSWORD: parokia_password
      POSTGRES_DB: parokia_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      file: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://parokia_user:parokia_password@postgres:5432/parokia_db
      PAROKIA_JWT_SECRET: ${PAROKIA_JWT_SECRET:-change-me-in-production}
      PAROKIA_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      PAROKIA_ENV: ${PAROKIA_ENV:-production}
    ports:
      - "${PORT:-8000}:8000"
    command: python server.py

  mcp:
    build:
      context: .
      file: backend/Dockerfile
    depends_on:
      - postgres
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://parokia_user:parokia_password@postgres:5432/parokia_db
      PAROKIA_JWT_SECRET: ${PAROKIA_JWT_SECRET:-change-me-in-production}
      PAROKIA_RUN_MCP: "1"
    command: python server.py

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      # Mount source in dev; the build uses the same Dockerfile for production.
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
