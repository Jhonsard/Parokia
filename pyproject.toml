[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parokia"
version = "1.1.0"
description = "REST API and FastMCP server for the Notre-Dame d'Afrique parish platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Parokia" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "pytest-cov>=4.0",
    # MCP Inspector CLI (`mcp dev backend/server.py`); typer/rich are not needed
    # by the production image, which installs backend/requirements.txt only.
    "mcp[cli]==1.2.0",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
